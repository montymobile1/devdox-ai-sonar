[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devdox_sonar"
version = "0.0.7"
description = "A CLI tool to analyze SonarCloud issues and attempt LLM-powered fixes"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0" }
authors = [
    {name = "Hayat Bourji", email = "hayat.bourgi@montyholding.com"}
]
maintainers = [
    {name = "Hayat Bourji", email = "hayat.bourgi@montyholding.com"},
]
keywords = ["sonarcloud", "code-analysis", "ai", "llm", "code-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Networking :: Monitoring",
]


# Core dependencies
dependencies = [
    "click==8.1.7",
    "rich-click==1.9.4",
    "requests>=2.32",
    "pydantic==2.10.6",
    "pydantic_core==2.27.2",
    "pydantic-settings==2.12.0",
    "python-dotenv==1.0.1",
    "openai==2.15.0",
    "google-genai==1.60.0",
    "sonar-tools==3.16.2",
    "pycodestyle==2.14.0",
    "autopep8==2.3.2",
    "pathlib2==2.3.0",
    "regex==2026.1.15",
    "GitPython==3.1.46",
    "together==2.1.1",
    "Jinja2==3.1.6",
    "types-requests==2.32.4.20250913",
    "tomli==2.3.0",
    "tomli-w==1.2.0",
    "questionary>=2.0.0",
    "tomlkit==0.13.3",
    "aiofiles==25.1.0",
    "langchain-core>=0.3.78,<1.0.0",  # Satisfy langchain-openai requirements
    "yake>=0.4.8",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "black==25.11.0",
    "isort==5.12.0",
    "flake8==7.3.0",
    "pytest-cov==7.0.0",
    "pytest-asyncio==0.26.0",
    "mypy==1.0.0",
    "pre-commit==3.0.0",
    "twine==4.0.0",
    "build==0.10.0",
    "ruff==0.14.7",
    "types-aiofiles==25.1.0.20251011"
]

[project.scripts]
devdox_sonar = "devdox_ai_sonar.cli:main"




[project.urls]
Homepage = "https://github.com/hayatbourgi/devdox-ai-sonar"
Repository = "https://github.com/hayatbourgi/devdox-ai-sonar"
Issues = "https://github.com/hayatbourgi/devdox-ai-sonar/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devdox_ai_sonar = ["prompts/*.j2","prompts/**/*.j2", "templates/*.j2","*.j2","models/*.py","utils/*.py","all_sonarcloud_rules.json"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
packages = ["devdox_sonar"]
mypy_path = "src"
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]