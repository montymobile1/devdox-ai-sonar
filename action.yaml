name: "DevDox AI sonar"
description: "Run devdox-sonar code quality analysis on your Python project"
inputs:
  command:
    description: "Command to run (e.g., 'fix_multiple')"
    required: true
    default: "fix_multiple"
  sonar-token:
    description: "SonarCloud authentication token (SONAR_TOKEN)"
    required: true
  sonar-org:
    description: "SonarCloud organization key (SONAR_ORG)"
    required: true
  sonar-project:
    description: "SonarCloud project key (SONAR_PROJ)"
    required: true
  project-path:
    description: "Local path to the project. Defaults to GITHUB_WORKSPACE if not set."
    required: true
    default: "/github/workspace"
  pull-request:
    description: "Pull request number"
    required: false
  llm-model:
    description: >-
      LLM model in OpenHands 'provider/model-name' form
      (e.g. 'openai/gpt-4o', 'gemini/gemini-2.5-flash', 'vllm/my-model').
    required: true
  llm-api-key:
    description: "API key for the LLM endpoint. May be blank if the endpoint accepts unauthenticated requests."
    required: false
    default: ""
  llm-base-url:
    description: "Optional custom endpoint URL (for self-hosted or proxied LLMs)."
    required: false
    default: ""
  max-fixes:
    description: "Max Issues to fix"
    required: false
    default: 10
  apply:
    description: "Apply fixes automatically"
    required: false
    default: 1
runs:
  using: "docker"
  image: "Dockerfile"
  args:
    - --command
    - ${{ inputs.command }}
    - --sonar-token
    - ${{ inputs.sonar-token }}
    - --sonar-org
    - ${{ inputs.sonar-org }}
    - --sonar-project
    - ${{ inputs.sonar-project }}
    - --project-path
    - ${{ inputs.project-path }}
    - --pull-request
    - ${{ inputs.pull-request }}
    - --llm-model
    - ${{ inputs.llm-model }}
    - --llm-api-key
    - ${{ inputs.llm-api-key }}
    - --llm-base-url
    - ${{ inputs.llm-base-url }}
    - --max-fixes
    - ${{ inputs.max-fixes }}
    - --apply
    - ${{ inputs.apply }}
branding:
  icon: "activity"
  color: "blue"
