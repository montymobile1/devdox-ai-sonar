name: "Fix Sonar Issues"
description: "Fix Sonar Issues using DevDox Sonar"
on: [push]

permissions:
  contents: write

jobs:
  devdox-sonar:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run DevDox Sonar (PR)

        uses: montymobile1/devdox-ai-sonar@0.0.1
        with:
            # ── SonarCloud ──────────────────────────────────────────────────────
            sonar-token: ${{ secrets.SONAR_TOKEN }}
            sonar-org: ${{ secrets.SONAR_ORG }}
            sonar-project: ${{ secrets.SONAR_PROJ }}

            # ── Analysis mode ───────────────────────────────────────────────────
            clone-type: "pr"
            pull-number:  ${{ github.event.pull_request.number }}

            # ── LLM ─────────────────────────────────────────────────────────────
            llm-provider: ${{ secrets.LLM_API_PROVIDER}}
            llm-api-key: ${{ secrets.LLM_API_KEY }}
            llm-default-model:  ${{ secrets.LLM_MODEL }}
            llm-models: "gpt-4o,gpt-4o-mini"

            # ── Optional tuning ─────────────────────────────────────────────────
            max-fixes: "10"
            exclude-rules: "python:S101,python:S106"

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: devdox-sonar-report
            path: .devdox-sonar-report
            retention-days: 30