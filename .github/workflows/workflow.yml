name: "Fix Sonar Issues"
description: "Fix Sonar Issues using DevDox Sonar"

on: [pull_request]

permissions:
  contents: write

jobs:
  devdox-sonar:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run DevDox Sonar (PR)
        uses: montymobile1/devdox-ai-sonar@0.0.4
        with:
            command : fix_multiple
            # ── SonarCloud ──────────────────────────────────────────────────────
            sonar-token: ${{ secrets.SONAR_TOKEN }}
            sonar-org: ${{ secrets.SONAR_ORG }}
            sonar-project: ${{ secrets.SONAR_PROJ }}
            project-path: /github/workspace

            # ── Analysis mode ───────────────────────────────────────────────────
            pull-request: ${{ github.event.pull_request.number }}

            # ── LLM ─────────────────────────────────────────────────────────────
            llm-provider: ${{ secrets.LLM_API_PROVIDER}}
            llm-api-key: ${{ secrets.LLM_API_KEY }}
            llm-default-model:  ${{ secrets.LLM_MODEL }}

          # ── Optional tuning ─────────────────────────────────────────────────
            max-fixes: "10"
            apply: 1

      - name: Commit fixes to new branch
        if: always()
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            BRANCH="devdox-sonar-fixes/run-${{ github.run_id }}"
            git checkout -b $BRANCH
            
            git add -A
            git diff --cached --quiet || git commit -m "fix: apply devdox sonar fixes [run ${{ github.run_id }}]"
            
            git push origin $BRANCH
            
            echo "✅ Fixes pushed to branch: $BRANCH"