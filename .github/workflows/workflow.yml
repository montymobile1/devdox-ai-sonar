name: "Fix Sonar Issues"
description: "Fix Sonar Issues using DevDox Sonar"
on: [pull_request]

permissions:
  contents: write

jobs:
  devdox-sonar:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run DevDox Sonar (PR)
        uses: montymobile1/devdox-ai-sonar@main
        with:
            command : fix_multiple
            # ── SonarCloud ──────────────────────────────────────────────────────
            sonar-token: ${{ secrets.SONAR_TOKEN }}
            sonar-org: ${{ secrets.SONAR_ORG }}
            sonar-project: ${{ secrets.SONAR_PROJ }}
            project-path: /github/workspace

            # ── Analysis mode ───────────────────────────────────────────────────
            pull-request: ${{ github.event.pull_request.number }}

            # ── LLM ─────────────────────────────────────────────────────────────
            llm-provider: ${{ secrets.LLM_API_PROVIDER}}
            llm-api-key: ${{ secrets.LLM_API_KEY }}
            llm-default-model:  ${{ secrets.LLM_MODEL }}

          # ── Optional tuning ─────────────────────────────────────────────────
            max-fixes: "10"
            apply: 1

      - name: Zip modified files
        if: always()
        run: |
            cd ${{ github.workspace }}
            
            # Zip the sonar report
            if [ -d ".devdox-sonar-report" ]; then
            zip -r devdox-sonar-report.zip .devdox-sonar-report/
            fi
            
            # Zip modified source files (tracked by git)
            git diff --name-only | xargs -I {} zip -u devdox-sonar-fixes.zip {} || true
            
            echo "=== Zipped files ==="
            ls -lh *.zip 2>/dev/null || echo "No zip files created"

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
                name: devdox-sonar-report
                path: |
                  ${{ github.workspace }}/devdox-sonar-report.zip
                  ${{ github.workspace }}/devdox-sonar-fixes.zip
                retention-days: 30